<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>

    <!-- Modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #e9eef5;
            --text: #1e1e1e;
            --card: rgba(255, 255, 255, 0.85);
            --accent: #4a90e2;
        }

        body.dark {
            --bg: #0f0f0f;
            --text: #ffffff;
            --card: rgba(40, 40, 40, 0.8);
            --accent: #77b5ff;
        }

        body {
            background: var(--bg);
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 25px;
            text-align: center;
            color: var(--text);
            transition: background 0.3s ease;
        }

        /* Container with glass effect */
        .container {
            max-width: 850px;
            margin: auto;
            background: var(--card);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            transition: 0.3s ease;
        }

        /* Gradient title */
        h2 {
            font-size: 32px;
            background: linear-gradient(45deg, #4a90e2, #6f3dea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        #textDisplay {
            font-size: 22px;
            line-height: 35px;
            padding: 20px;
            border-radius: 12px;
            background: #f0f3fa;
            min-height: 150px;
            text-align: left;
            border-left: 6px solid var(--accent);
        }

        .correct { color: #25a325; }
        .wrong { color: #e63946; }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #d0d0d0;
            font-size: 18px;
            outline: none;
            resize: none;
            transition: 0.2s;
            background: #ffffff;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(74,144,226,0.4);
        }

        .stats {
            margin-top: 25px;
            font-size: 18px;
            font-weight: 600;
        }

        .stats p {
            margin: 8px 0;
        }

        /* Stylish button */
        .btn {
            margin-top: 25px;
            padding: 12px 35px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn:hover {
            background: #3b7ac4;
            transform: translateY(-2px);
        }

        /* Dark mode toggle */
        .toggle-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            padding: 10px 18px;
            background: #111;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .toggle-btn:hover {
            background: #333;
        }

        /* Progress Bar */

        #progressBar {
            width: 100%;
            height: 12px;
            background: #cfcfcf;
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4a90e2, #6f3dea);
            transition: width 1s linear;
        }
    </style>
</head>

<body>

<button class="toggle-btn" onclick="toggleDark()">🌙 Dark Mode</button>

<div class="container">
    <h2>⏱ Advanced Typing Speed Test</h2>

    <div id="textDisplay"></div>

    <textarea id="input" placeholder="Start typing here..."></textarea>

    <div id="progressBar"><div id="progress"></div></div>

    <div class="stats">
        <p id="timer">Time Left: 60s</p>
        <p id="wpm"></p>
        <p id="cpm"></p>
        <p id="accuracy"></p>
        <p id="mistakes"></p>
    </div>

    <button class="btn" onclick="restart()">Restart</button>
</div>

<script>
    const paragraphs = [
        "The quick brown fox jumps over the lazy dog.",
        "Typing fast is a useful skill for everyone in the digital world.",
        "Practice consistently if you want to improve your typing speed and accuracy.",
        "Programming languages help us communicate instructions to a computer effectively.",
        "Reading books daily can greatly improve your vocabulary and understanding."
    ];

    const textDisplay = document.getElementById("textDisplay");
    const inputField = document.getElementById("input");
    const timerEl = document.getElementById("timer");
    const wpmEl = document.getElementById("wpm");
    const cpmEl = document.getElementById("cpm");
    const accuracyEl = document.getElementById("accuracy");
    const mistakesEl = document.getElementById("mistakes");
    const progress = document.getElementById("progress");

    let originalText = "";
    let timeLeft = 60;
    let timer = null;
    let started = false;
    let totalMistakes = 0;

    function loadParagraph() {
        let randomIndex = Math.floor(Math.random() * paragraphs.length);
        originalText = paragraphs[randomIndex];
        textDisplay.innerHTML = originalText.split("").map(char => `<span>${char}</span>`).join("");
    }

    loadParagraph();

    inputField.addEventListener("input", () => {
        const inputText = inputField.value;
        const chars = textDisplay.querySelectorAll("span");

        if (!started) {
            started = true;
            startTimer();
        }

        totalMistakes = 0;

        chars.forEach((charSpan, index) => {
            let typedChar = inputText[index];

            if (typedChar == null) {
                charSpan.classList.remove("correct", "wrong");
            } 
            else if (typedChar === charSpan.innerText) {
                charSpan.classList.add("correct");
                charSpan.classList.remove("wrong");
            } 
            else {
                charSpan.classList.add("wrong");
                charSpan.classList.remove("correct");
                totalMistakes++;
            }
        });

        mistakesEl.textContent = `Mistakes: ${totalMistakes}`;

        if (inputText === originalText) {
            clearInterval(timer);
            finishTest();
        }
    });

    function startTimer() {
        timer = setInterval(() => {
            timeLeft--;
            timerEl.textContent = `Time Left: ${timeLeft}s`;
            progress.style.width = `${(timeLeft / 60) * 100}%`;

            if (timeLeft === 0) {
                clearInterval(timer);
                finishTest();
            }
        }, 1000);
    }

    function finishTest() {
        inputField.disabled = true;

        let typed = inputField.value.length;
        let correctChars = typed - totalMistakes;

        let wpm = Math.round((typed / 5));
        let cpm = typed;
        let accuracy = typed === 0 ? 0 : Math.round((correctChars / typed) * 100);

        wpmEl.textContent = `WPM: ${wpm}`;
        cpmEl.textContent = `CPM: ${cpm}`;
        accuracyEl.textContent = `Accuracy: ${accuracy}%`;
    }

    function restart() {
        clearInterval(timer);
        timeLeft = 60;
        started = false;
        inputField.disabled = false;
        inputField.value = "";
        timerEl.textContent = "Time Left: 60s";
        wpmEl.textContent = "";
        cpmEl.textContent = "";
        accuracyEl.textContent = "";
        mistakesEl.textContent = "";
        progress.style.width = "100%";
        loadParagraph();
    }

    function toggleDark() {
        document.body.classList.toggle("dark");
    }
</script>

</body>
</html>
